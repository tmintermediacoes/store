<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Encontrando a página…</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
    }
    main {
      text-align: center;
      max-width: 420px;
      padding: 32px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { margin: 0; line-height: 1.6; }
    code { background: rgba(15, 23, 42, 0.35); padding: 4px 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <main id="status">
    <h1>Processando URL…</h1>
    <p>Estamos tentando encontrar o destino correto.</p>
  </main>
  <script>
    const statusEl = document.getElementById("status");

    const caminho = window.location.pathname.replace(/\/+/g, "/");
    const partes = caminho.split("/").filter(Boolean);

    if (partes.length === 0) {
      statusEl.innerHTML = `
        <h1>Página não encontrada</h1>
        <p>Adicione um identificador ao final da URL, por exemplo <code>/12345</code>.</p>
      `;
    } else {
      const id = partes.pop();
      if (id) {
        const destino = `https://www.amazon.com.br/dp/${encodeURIComponent(id)}`;
        window.location.replace(destino);
      } else {
        statusEl.innerHTML = `
          <h1>Página não encontrada</h1>
          <p>Verifique o identificador e tente novamente.</p>
        `;
      }
    }
  </script>
</body>
</html>
